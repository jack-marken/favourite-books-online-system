<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Favourite Books</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    </head>
    <body onload="prepareCart()">
        
        <div id="navbar-placeholder"></div>
        
        <div class="container my-5">
          <a href="{{ url_for('index') }}" class="btn btn-outline-secondary mb-4"><i class="bi bi-arrow-left"></i> Back to Home</a>
          <h1>Checkout</h1>
          <form id="checkout-form" class="form">
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name"><br>
            <label for="email">Email</label><br>
            <input type="text" id="email" name="email"><br>
            <label for="address">Address</label><br>
            <input type="text" id="address" name="address"><br>
            <label for="state">State</label><br>
            <input type="text" id="state" name="state"><br>
            <label for="postcode">Postcode</label><br>
            <input type="text" id="postcode" name="postcode"><br>
            <br><br>
            <label for="credit-card-no">Credit Card (placeholder)</label><br>
            <input type="text" id="credit-card-no" name="credit-card-no"><br>

            <h2 id="total-price">Price: $0</h2>
          </form>
          <button onclick="checkPayment()">Place Order</a>
        </div>


  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 Favourite Books | All Rights Reserved</p>
  </footer>
