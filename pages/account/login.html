<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Favourite Books</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    </head>
    <body>
        
        <div id="navbar-placeholder"></div>
        
        <div class="container my-5">
          <h1>Login</h1>
          <a href="../account/register.html">Don't have an account? Register</a>

          <div class="row justify-content-center mt-4">
            <div class="col-12 col-md-6 col-lg-5">
              <div id="loginAlert" class="alert d-none" role="alert"></div>
              <form id="loginForm" class="card p-4 shadow-sm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" required>
                </div>
                <div class="d-grid">
                  <button class="btn btn-primary" type="submit">Login</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 Favourite Books | All Rights Reserved</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- <script src="../js/navbar.js" data-depth="pages"></script> -->

  <script src="../../js/navbar.js" data-depth="nested"></script>
  <script src="../../js/Login.js"></script>
</body>
</html>
