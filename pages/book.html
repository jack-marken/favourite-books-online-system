<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Favourite Books</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    </head>
    <body>
        
        <div id="navbar-placeholder"></div>
        
        <div class="container my-5">
          <h1>placeholder:</h1>
          <a href="../pages/cart.html">link to cart</a>
        </div>

        <div class="container my-5">
            <a href="../index.html" class="btn btn-outline-secondary mb-4"><i class="bi bi-arrow-left"></i> Back to Home</a>

            <div class="row g-5" id="book-details-container">
                <div class="col-12 col-md-5 text-center">
                    <img id="book-cover" src="" alt="Book Cover" class="img-fluid rounded shadow-sm" style="max-height: 450px;">
                </div>

                <div class="col-12 col-md-7">
                    <span id="book-badge" class="badge bg-danger mb-2 d-none"></span>
                    <h1 id="book-title" class="display-5 fw-bold">Loading Title...</h1>
                    <p class="text-muted fs-4">By <span id="book-author">Loading Author...</span></p>
                    <p id="book-genre" class="badge bg-secondary mb-3"></p>
                    
                    <hr>
                    
                    <p id="book-description" class="lead">Loading description...</p>
                    
                    <div class="my-4">
                        <h3 class="text-danger fw-bold mb-0" id="book-price">$0.00</h3>
                        <small id="book-stock" class="text-muted"></small>
                    </div>

                    <button id="add-to-cart-btn" class="btn btn-primary btn-lg px-5">
                        <i class="bi bi-cart-plus"></i> Add to Cart
                    </button>
                </div>
            </div>
        </div>
        
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 Favourite Books | All Rights Reserved</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/navbar.js" data-depth="pages"></script>
  <script src="../js/book.js"></script>
</body>
</html>
